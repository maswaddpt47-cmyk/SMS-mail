function el(tag, attrs, children){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==="style") e.style.cssText=attrs[k];
    else if(k==="class") e.className=attrs[k];
    else if(k==="html") e.innerHTML=attrs[k];
    else if(k.startsWith("on")&&typeof attrs[k]==="function") e.addEventListener(k.slice(2).toLowerCase(),attrs[k]);
    else if(attrs[k]===true) e.setAttribute(k,"");
    else if(attrs[k]!==false&&attrs[k]!=null) e.setAttribute(k,attrs[k]);
  }
  if(children!=null){
    (Array.isArray(children)?children:[children]).forEach(c=>{
      if(c==null||c===false) return;
      e.appendChild(typeof c==="string"||typeof c==="number"?document.createTextNode(String(c)):c);
    });
  }
  return e;
}
function clear(node){ while(node.firstChild) node.removeChild(node.firstChild); }

/* ============================== PERSISTENCE ============================== */
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){showToast('⚠️ Stockage plein. Exportez vos données !','warn');}}
function persist(){
  lsSet('ess-cms',S.cmsList);lsSet('ess-demarches',S.demarches);lsSet('ess-secteurs',S.secteurs);
  lsSet('ess-templates',S.templates);lsSet('ess-custom-tpl',S.customTemplates);lsSet('ess-vars',S.customVars);
  lsSet('ess-hidden',S.hiddenBuiltinKeys);
  var now=new Date().toLocaleString('fr-FR');lsSet('ess-lastSave',now);
  S.saveStatus='Sauvegardé le '+now;renderHeader();
}
function saveLast(){lsSet('ess-last',{selectedCMS:S.selectedCMS,selectedDemarche:S.selectedDemarche,commune:S.commune});}

/* ============================== TOAST ============================== */
var _toastId=0;
function showToast(msg,type){
  type=type||'ok';
  var id=Date.now();_toastId=id;
  S.toast={msg:msg,type:type};
  renderToast();
  setTimeout(function(){if(_toastId===id){S.toast=null;renderToast();}},2400);
}
function renderToast(){
  var root=document.getElementById('toast-root');clear(root);
  if(!S.toast)return;
  var colors={ok:'oklch(0.55 0.13 158)',err:'oklch(0.55 0.18 25)',warn:'oklch(0.62 0.14 60)'};
  root.appendChild(el('div',{class:'gx-toast',style:'position:fixed;bottom:30px;left:50%;z-index:200;transform:translateX(-50%);padding:12px 24px;border-radius:13px;font-size:13.5px;font-weight:700;color:#fff;background:'+(colors[S.toast.type]||colors.ok)+';box-shadow:0 12px 36px oklch(0.2 0.03 264 / .35);animation:toastIn .3s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;'},S.toast.msg));
}

/* ============================== TEMPLATE FILL ============================== */
function fillTemplate(tpl,v){
  var civStr=v.civilite||"";var prenomStr=v.prenom||"";var nomStr=v.nom||"";
  var fullName=[prenomStr,nomStr].filter(Boolean).join(" ");
  var greeting="";
  if(civStr&&fullName)greeting=" "+civStr+" "+fullName;
  else if(civStr&&!fullName)greeting=" "+civStr;
  else if(!civStr&&fullName)greeting=" "+fullName;
  var dateFmt=v.date?new Date(v.date).toLocaleDateString("fr-FR",{weekday:"long",year:"numeric",month:"long",day:"numeric"}):"[date]";
  var docList=(v.documents||[]).map(function(d){return "• "+d;}).join("\n");
  var r=(tpl||"")
    .replace(/{civilite}/g,civStr).replace(/{prenom}/g,prenomStr).replace(/{nom}/g,nomStr)
    .replace(/{prenom_nom}/g,fullName).replace(/{greeting}/g,greeting)
    .replace(/Bonjour \{civilite\} \{prenom\}/g,"Bonjour"+greeting)
    .replace(/Bonjour\{civilite\} \{prenom\}/g,"Bonjour"+greeting)
    .replace(/Bonjour \{prenom\}/g,"Bonjour"+greeting)
    .replace(/Bonjour\{prenom\}/g,"Bonjour"+greeting)
    .replace(/{demarche}/g,v.demarche||"[démarche]").replace(/{date}/g,dateFmt)
    .replace(/{heure}/g,v.heure||"[heure]").replace(/{adresse}/g,v.adresse||"[adresse]")
    .replace(/{documents}/g,docList).replace(/{commune}/g,v.commune||"[commune]");
  for(var i=0;i<S.customVars.length;i++){var cv=S.customVars[i];if(cv.nom)r=r.replace(new RegExp("\\{"+cv.nom+"\\}","g"),cv.valeur);}
  return r.replace(/Bonjour  /g,"Bonjour ");
}

function compute(){
  var cms=S.cmsList.find(function(c){return String(c.id)===String(S.selectedCMS);});
  var dem=S.selectedDemarche==="__autre__"?{nom:S.demarcheAutre||"Autre",documents:[]}:S.demarches.find(function(d){return String(d.id)===String(S.selectedDemarche);});
  var vars={civilite:S.civilite,prenom:S.prenom,nom:S.nom,demarche:dem?dem.nom:"[démarche]",date:S.date,heure:S.heure,adresse:cms?cms.adresse:"[adresse]",documents:dem?dem.documents:[],commune:S.commune};
  var body="",subject="";
  if(S.selectedTemplate!=="__default__"){
    var ct=S.customTemplates.find(function(t){return String(t.id)===String(S.selectedTemplate);});
    if(ct){body=fillTemplate(ct.body,vars);subject=ct.canal==="mail"?fillTemplate(ct.sujet||"",vars):"";}
  } else {
    var bk={sms:{proposition:"sms_proposition",confirmation:"sms_confirmation",sans_appel:"sms_sans_appel"},mail:{proposition:"mail_proposition",confirmation:"mail_confirmation",sans_appel:"mail_sans_appel"}};
    var sk={proposition:"mail_proposition_sujet",confirmation:"mail_confirmation_sujet",sans_appel:"mail_sans_appel_sujet"};
    var bodyKey=bk[S.channel][S.msgType];
    var tpl=S.templates[bodyKey]||DEFAULT_TEMPLATES[bodyKey]||"";
    body=fillTemplate(tpl,vars);
    if(S.channel==="mail")subject=fillTemplate(S.templates[sk[S.msgType]]||DEFAULT_TEMPLATES[sk[S.msgType]]||"",vars);
  }
  return {body:body,subject:subject,dem:dem,cms:cms};
}
function regen(){var r=compute();S.generatedBody=r.body;S.generatedSubject=r.subject;}

function canGenerate(){
  var isAutre=S.selectedDemarche==="__autre__";
  return !!(S.civilite&&S.nom&&S.selectedCMS&&S.selectedDemarche&&S.date&&S.heure&&S.commune&&(!isAutre||S.demarcheAutre));
}
function missingFields(){
  var isAutre=S.selectedDemarche==="__autre__";var m=[];
  if(!S.civilite)m.push("Civilité");if(!S.nom)m.push("Nom");if(!S.date)m.push("Date");if(!S.heure)m.push("Heure");
  if(!S.commune)m.push("CMS");if(!S.selectedCMS)m.push("Adresse");if(!S.selectedDemarche)m.push("Démarche");
  if(isAutre&&!S.demarcheAutre)m.push("Préciser la démarche");
  return m.map(function(x){return "⚠ "+x;});
}
function partsInfo(){
  var txt=S.generatedBody||"";var len=txt.length;
  var isUnicode=/[^\x00-\x7F€£¥]/.test(txt)||/[Ā-￿]/.test(txt);
  var single=isUnicode?70:160,multi=isUnicode?67:153;
  var parts=len<=single?1:Math.ceil(len/multi);
  return {len:len,parts:parts};
}

function handleGenerate(){
  if(!canGenerate())return;
  var r=compute();var body=r.body,subject=r.subject,dem=r.dem;
  if(S.channel==='sms'){
    var t=body;var len=t.length;var u=/[^\x00-\x7F€£¥]/.test(t);var single=u?70:160,multi=u?67:153;var parts=len<=single?1:Math.ceil(len/multi);
    if(parts>3&&!confirm("⚠️ Ce message fait "+parts+" SMS ("+len+" caractères).\nContinuer quand même ?"))return;
  }
  S.generatedBody=body;S.generatedSubject=subject;
  addHistory({channel:S.channel,msgType:S.msgType,body:body,subject:subject,civilite:S.civilite,prenom:S.prenom,nom:S.nom,telephone:S.telephone,demarche:dem?dem.nom:"",date:S.date,heure:S.heure,ts:new Date().toLocaleString('fr-FR')});

  renderGenerate();renderHistory();renderMandat();
}

function doCopy(text){
  return new Promise(function(resolve){
    if(!text){resolve(false);return;}
    if(navigator.clipboard&&window.isSecureContext){
      navigator.clipboard.writeText(text).then(function(){resolve(true);},function(){fallback();});
    } else fallback();
    function fallback(){
      try{var ta=document.createElement("textarea");ta.value=text;ta.style.cssText="position:fixed;top:0;left:0;opacity:0;";document.body.appendChild(ta);ta.focus();ta.select();document.execCommand("copy");document.body.removeChild(ta);resolve(true);}catch(e){resolve(false);}
    }
  });
}
function flashCopied(key){S.copied[key]=true;renderAll();setTimeout(function(){S.copied[key]=false;renderAll();},1800);}

      if(cms&&r.dem)addHistory({channel:S.channel,msgType:S.msgType,body:S.generatedBody,subject:S.generatedSubject,civilite:S.civilite,prenom:S.prenom,nom:S.nom,telephone:S.telephone,demarche:r.dem.nom,date:S.date,heure:S.heure,ts:new Date().toLocaleString('fr-FR')});
    }
    flashCopied('body');showToast("✓ Copié !");
  });
}

  +'<p>Cette autorisation est conforme aux articles 1984 et suivants du Code civil. Les démarches seront accomplies sur internet, sur des sites utilisant FranceConnect ou sur d\'autres sites. Elles peuvent être aussi accomplies par tous les moyens permis par l\'administration (téléphone, papier, email,…).</p>'
  +'<p>Je peux annuler mon autorisation à tout moment.</p>'
  +'<p>Pour que <b>'+esc(STR)+'</b> puisse agir à ma place :</p>'
  +'<ul>'
  +li('Je reconnais que l\'aidant habilité par <b>'+esc(STR)+'</b> m\'a rappelé l\'objet de son intervention, et m\'a informé sur la nécessité et l\'utilité des informations collectées ;')
  +li('J\'autorise les aidants habilités par <b>'+esc(STR)+'</b> à utiliser mes données personnelles dans le cadre de ce mandat. Je sais que j\'ai des droits sur les informations me concernant : accès, rectification, suppression.')
  +'</ul>'
  +'<p>Les aidants habilités par <b>'+esc(STR)+'</b> doivent :</p>'
  +'<ul>'+ob1+'</ul>'
  +'<p>A partir du moment où un aidant habilité par <b>'+esc(STR)+'</b> réalise à ma place une des démarches listées dans ce document, il accepte de le faire dans les conditions décrites dans ce document.</p>'
  +'<p>Mon autorisation est donnée et acceptée pour une durée de <b>'+esc(DUREE)+'</b>. Elle se termine avant si :</p>'
  +'<ul>'+finSi+'</ul>'
  +'<p>L\'aidant habilité par <b>'+esc(STR)+'</b> doit accomplir à ma place les démarches listées dans ce document tant que le mandat est valable. L\'aidant habilité par <b>'+esc(STR)+'</b> pourra être responsable s\'il ne respecte pas les conditions décrites dans ce document (article 1991 du Code civil.).</p>'
  +'<p style="margin-top:14pt">'+esc(faitA)+'</p>'

  // Signatures table
  +'\n<table width="100%" cellpadding="0" cellspacing="0" style="margin-top:30pt;">'
  +'<tr>'
  +'<td width="48%" valign="top" style="padding-right:10pt">'
  +'<p style="margin:0;font-weight:bold;font-size:11pt">Signature du mandant (usager) :</p>'
  +'<p style="margin:50pt 0 0;border-top:1pt solid #999;font-size:1pt">&nbsp;</p>'
  +'</td>'
  +'<td width="4%"></td>'
  +'<td width="48%" valign="top">'
  +'<p style="margin:0;font-weight:bold;font-size:11pt">Signature du mandataire ('+esc(STR)+') :</p>'
  +'<p style="margin:50pt 0 0;border-top:1pt solid #999;font-size:1pt">&nbsp;</p>'
  +'</td>'
  +'</tr>'
  +'</table>'

  +'</body></html>';

  var blob=new Blob(['﻿'+docHtml],{type:'application/msword;charset=utf-8'});
  var nom=(S.mandatNom||'usager').toUpperCase();
  var prenom=S.mandatPrenom||'';
  var fname='mandat-'+[prenom,nom].filter(Boolean).join('-').replace(/\s+/g,'-')+'-'+today.replace(/\//g,'-')+'.doc';
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;a.click();URL.revokeObjectURL(a.href);
  showToast('✓ Fichier Word téléchargé');
  renderMandat();
}
function updateMandatDoc(){
  var doc=document.getElementById('mandat-doc');if(!doc)return;clear(doc);doc.appendChild(buildMandatDoc());
}
function archiveMandat(){
  if(!S.mandatNom&&!S.mandatPrenom){showToast("Renseignez au moins un nom","warn");return;}
  var item={
    id:Date.now(),
    civilite:S.mandatCivilite,prenom:S.mandatPrenom,nom:S.mandatNom,
    commune:S.mandatCommune,num:S.mandatNum,
    structure:STRUCTURE,duree:DUREE,
    date:todayFR(),ts:new Date().toLocaleString('fr-FR')
  };
  S.mandats=[item].concat(S.mandats);
  lsSet('ess-mandats',S.mandats);
  showToast("✓ Mandat archivé");
  renderMandats();
}

/* ============================== MANDATS ARCHIVÉS ============================== */
function renderMandats(){
  var pane=document.getElementById('pane-mandats');clear(pane);
  var wrap=el('div',{style:"max-width:760px;margin:0 auto;padding:clamp(18px,3vw,32px) clamp(16px,4vw,40px);"});
  var head=el('div',{style:"display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;"});
  head.appendChild(el('h2',{style:"margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em;"},"Mandats archivés"));
  if(S.mandats.length)head.appendChild(el('button',{class:'gx-press',style:"cursor:pointer;font-family:inherit;border:1px solid oklch(0.88 0.05 25);background:#fff;color:oklch(0.55 0.16 25);font-weight:600;font-size:12.5px;padding:8px 14px;border-radius:11px;",onClick:function(){if(confirm("Vider tous les mandats archivés ?")){S.mandats=[];lsSet('ess-mandats',[]);renderMandats();}}},"Vider"));
  wrap.appendChild(head);

  if(S.mandats.length===0){
    wrap.appendChild(el('div',{style:"text-align:center;padding:60px 0;color:oklch(0.6 0.02 264);",html:'<div style="font-size:40px;margin-bottom:10px;opacity:.5;">📄</div><div style="font-size:14px;">Aucun mandat archivé.</div>'}));
  } else {
    var list=el('div',{style:"display:flex;flex-direction:column;gap:10px;"});
    S.mandats.forEach(function(m){
      var full=[m.civilite,m.prenom,(m.nom||"").toUpperCase()].filter(Boolean).join(" ");
      var card=el('div',{class:'gx-lift',style:"background:#fff;border:1px solid oklch(0.92 0.008 256);border-radius:16px;padding:15px 17px;box-shadow:0 1px 2px oklch(0.5 0.05 264 / .04);display:flex;align-items:center;gap:12px;"});
      var info=el('div',{style:"flex:1;min-width:0;"});
      info.appendChild(el('div',{style:"font-weight:700;font-size:14px;"},full||"(sans nom)"));
      info.appendChild(el('div',{style:"font-size:12.5px;color:oklch(0.55 0.02 264);margin-top:3px;"},"Aidant : "+(m.aidant||"")+(m.commune?" · "+m.commune:"")));
      info.appendChild(el('div',{style:"font-size:11.5px;color:oklch(0.62 0.02 264);margin-top:2px;"},m.date+" · archivé le "+m.ts));
      card.appendChild(info);
      card.appendChild(el('button',{class:'gx-press',style:"cursor:pointer;font-family:inherit;border:none;background:oklch(0.95 0.03 266);color:oklch(0.5 0.16 266);font-weight:700;font-size:12.5px;padding:9px 14px;border-radius:11px;flex-shrink:0;",onClick:function(){regenMandat(m);}},"↻ Régénérer"));
      list.appendChild(card);
    });
    wrap.appendChild(list);
  }
  pane.appendChild(wrap);
}
function regenMandat(m){
  S.mandatSource="";
  S.mandatCivilite=m.civilite||"";S.mandatPrenom=m.prenom||"";S.mandatNom=m.nom||"";
  S.mandatNum=m.num||"";S.mandatCommune=m.commune||"";
  S.activeTab="mandat";
  renderTabs();showActivePane();renderMandat();
}

/* ============================== MODALS ============================== */
function renderModal(){
  var root=document.getElementById('modal-root');clear(root);
  if(!S.modal)return;
  var overlay=el('div',{class:'gx-modal',style:"position:fixed;inset:0;background:oklch(0.2 0.03 264 / .55);backdrop-filter:blur(5px);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;animation:overlayIn .2s ease;",onClick:closeModal});
  var box=el('div',{style:"background:#fff;border-radius:22px;padding:24px;max-width:560px;width:100%;box-shadow:0 30px 80px oklch(0.2 0.03 264 / .4);animation:popIn .25s cubic-bezier(.2,.8,.3,1);max-height:88vh;display:flex;flex-direction:column;gap:14px;",onClick:function(e){e.stopPropagation();}});

  function closeBtn(){return el('button',{class:'gx-press',style:"cursor:pointer;border:none;background:oklch(0.96 0.006 256);width:32px;height:32px;border-radius:50%;font-size:15px;color:oklch(0.5 0.02 264);",onClick:closeModal},"✕");}
  function header(title){var h=el('div',{style:"display:flex;align-items:center;justify-content:space-between;"});h.appendChild(el('div',{style:"font-weight:800;font-size:17px;"},title));h.appendChild(closeBtn());return h;}

  if(S.modal==='export'){
    box.appendChild(header("Sauvegarde"));
    box.appendChild(el('div',{style:"background:oklch(0.96 0.04 155);border:1px solid oklch(0.85 0.06 155);border-radius:12px;padding:12px 14px;font-size:12.5px;color:oklch(0.42 0.1 155);line-height:1.55;"},"Téléchargez le fichier JSON ou copiez le contenu pour restaurer vos données ailleurs."));
    var ta=el('textarea',{readonly:true,class:'gx-scroll',style:"width:100%;height:200px;font-family:ui-monospace,monospace;font-size:11px;border:1.5px solid oklch(0.91 0.008 256);border-radius:12px;padding:12px;resize:none;color:oklch(0.4 0.02 264);background:oklch(0.98 0.004 256);"});ta.value=S.exportText;box.appendChild(ta);
    var br=el('div',{style:"display:flex;gap:10px;"});
    br.appendChild(el('button',{class:'gx-press',style:"cursor:pointer;flex:1;font-family:inherit;border:none;background:oklch(0.5 0.16 266);color:#fff;font-weight:700;font-size:13.5px;padding:12px;border-radius:12px;",onClick:downloadExport},"⬇ Télécharger"));
    br.appendChild(el('button',{class:'gx-press',style:"cursor:pointer;flex:1;font-family:inherit;border:1px solid oklch(0.88 0.01 256);background:#fff;color:oklch(0.4 0.03 264);font-weight:600;font-size:13.5px;padding:12px;border-radius:12px;",onClick:copyExport},S.copied.export?"✓ Copié !":"📋 Copier"));
    box.appendChild(br);
  }
  else if(S.modal==='import'){
    box.appendChild(header("Importer une sauvegarde"));
    box.appendChild(el('div',{style:"background:oklch(0.97 0.04 75);border:1px solid oklch(0.87 0.06 75);border-radius:12px;padding:12px 14px;font-size:12.5px;color:oklch(0.46 0.09 70);line-height:1.55;"},"⚠️ L'import remplacera toutes vos données actuelles."));
    var ita=el('textarea',{placeholder:'{ "cmsList": [...], "demarches": [...] }',class:'gx-scroll',style:"width:100%;height:200px;font-family:ui-monospace,monospace;font-size:11px;border:1.5px solid oklch(0.91 0.008 256);border-radius:12px;padding:12px;resize:none;color:oklch(0.3 0.02 264);background:#fff;",onInput:function(e){S.importText=e.target.value;}});ita.value=S.importText;box.appendChild(ita);
    box.appendChild(el('button',{class:'gx-press',style:"cursor:pointer;font-family:inherit;border:none;background:oklch(0.5 0.16 266);color:#fff;font-weight:700;font-size:13.5px;padding:12px;border-radius:12px;",onClick:doImport},"Importer et remplacer"));
    if(S.importError)box.appendChild(el('div',{style:"color:oklch(0.55 0.16 25);font-size:12.5px;font-weight:600;text-align:center;"},S.importError));
  }
  else if(S.modal==='hist'){
    var hi=S.histItem;
    box.appendChild(header(hi?((hi.channel==="sms"?"💬 SMS — ":"✉️ Mail — ")+hi.demarche):""));
    if(hi&&hi.subject){
      var sd=el('div');sd.appendChild(el('div',{style:"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:oklch(0.6 0.02 264);margin-bottom:5px;"},"Objet"));
      var sin=el('input',{readonly:true,style:"width:100%;font-family:inherit;font-size:13.5px;font-weight:600;padding:10px 12px;border:1.5px solid oklch(0.91 0.008 256);border-radius:11px;background:oklch(0.98 0.004 256);color:inherit;"});sin.value=hi.subject;sd.appendChild(sin);box.appendChild(sd);
    }
    var hta=el('textarea',{readonly:true,class:'gx-scroll',style:"width:100%;height:300px;font-family:ui-monospace,monospace;font-size:12px;line-height:1.6;border:1.5px solid oklch(0.91 0.008 256);border-radius:12px;padding:13px;resize:none;color:oklch(0.35 0.02 264);background:oklch(0.98 0.004 256);"});hta.value=hi?hi.body:"";box.appendChild(hta);
    box.appendChild(el('button',{class:'gx-press',style:"cursor:pointer;font-family:inherit;border:none;background:oklch(0.5 0.16 266);color:#fff;font-weight:700;font-size:13.5px;padding:12px;border-radius:12px;",onClick:copyHistModal},S.copied.histmodal?"✓ Copié !":"📋 Copier"));
  }
  overlay.appendChild(box);root.appendChild(overlay);
}

/* ============================== MASTER RENDER ============================== */
function renderAll(){
  renderHeader();renderTabs();showActivePane();
  renderGenerate();renderHistory();renderTemplates();renderConfig();renderMandat();renderMandats();
  renderModal();renderToast();
}

/* ============================== INIT ============================== */
function init(){
  var last=ls('ess-last',{});
  var lastSave=ls('ess-lastSave',null);
  S.cmsList=ls('ess-cms',DEFAULT_CMS);
  S.demarches=ls('ess-demarches',DEFAULT_DEMARCHES);
  S.secteurs=ls('ess-secteurs',DEFAULT_SECTEURS);
  S.templates=ls('ess-templates',DEFAULT_TEMPLATES);
  S.customTemplates=ls('ess-custom-tpl',DEFAULT_CUSTOM);
  S.customVars=ls('ess-vars',[]);
  S.hiddenBuiltinKeys=ls('ess-hidden',[]);
  S.history=ls('ess-history',[]);
  S.mandats=ls('ess-mandats',[]);
  S.selectedCMS=last.selectedCMS||"";
  S.selectedDemarche=last.selectedDemarche||"";
  S.commune=last.commune||"";
  S.saveStatus=lastSave?('Dernière sauvegarde : '+lastSave):'Données chargées';

  regen();
  renderAll();

  document.getElementById('btnImport').addEventListener('click',openImport);
  document.getElementById('btnExport').addEventListener('click',openExport);

  document.addEventListener('keydown',function(e){
    var ctrl=e.ctrlKey||e.metaKey;
    if(ctrl&&e.key==='Enter'){e.preventDefault();if(canGenerate())handleGenerate();}
    if(ctrl&&e.shiftKey&&(e.key==='C'||e.key==='c')){e.preventDefault();if(S.generatedBody)copyBody();}
  });
}
document.addEventListener('DOMContentLoaded',init);
</script>
